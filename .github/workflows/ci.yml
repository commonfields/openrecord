# OpenRecord pull-request CI.
#
# Separate from release publishing (.github/workflows/release.yml): this
# workflow validates every push and pull request. Every gate relies on the
# underlying command's exit status — never on grepping command output.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: CLI fmt / clippy / test / contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Formatting (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: Lints (clippy, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests (all targets, locked deps)
        run: cargo test --all-targets --locked

      - name: Build the primary CLI
        run: cargo build --locked --bin openrecord

      - name: Release build (all targets)
        run: cargo build --release --locked

      - name: Evidence protocol fixtures (Rust side)
        run: cargo test --locked --test evidence_protocol_fixtures

      - name: CLI exit contracts (isolated HOME, mock only, no network)
        run: OPENRECORD_BIN="${{ github.workspace }}/target/debug/openrecord" bash scripts/check-cli-contracts.sh

      - name: Release-script regression tests (stubbed cargo, no network)
        run: bash scripts/test-validate-release.sh

      - name: Installer checksum regression tests (offline fixtures)
        run: bash scripts/test-install.sh

  hosted:
    name: hosted typecheck / lint / tests / builds (mock only)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openrecord
          POSTGRES_PASSWORD: openrecord
          POSTGRES_DB: openrecord
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openrecord"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://openrecord:openrecord@localhost:5432/openrecord
      TEST_DATABASE_URL: postgres://openrecord:openrecord@localhost:5432/openrecord
      OPENRECORD_SCRATCH_URL: postgres://openrecord:openrecord@localhost:5432/openrecord
      SESSION_SECRET: ci-test-secret-32-bytes-minimum-xyz
      NINE_ROUTER_ENABLED: "false"
      APP_BASE_URL: http://localhost:3000
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node 24 LTS (hosted baseline; see .node-version)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install TypeScript workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Migrate hosted Postgres
        run: pnpm db:migrate

      - name: Typecheck (strict)
        run: pnpm typecheck

      - name: Lint (real ESLint, fails on violations)
        run: pnpm lint

      - name: All workspace tests (PG16, local HTTP fixtures, semantic and architecture guards)
        run: pnpm test

      - name: All workspace builds
        run: pnpm build

      - name: Built hosted runtime smoke (disposable CI database)
        env:
          HOSTED_SMOKE_ALLOWED: "1"
        run: python3 scripts/hosted-runtime-smoke.py

      - name: Built agency record workflow (TEST fixtures only)
        env:
          HOSTED_SMOKE_ALLOWED: "1"
        run: python3 scripts/agency-record-runtime-smoke.py

      - name: Built connected execution workflow (TEST fixtures, local GitHub stand-in, mock only)
        env:
          HOSTED_SMOKE_ALLOWED: "1"
        run: python3 scripts/connected-execution-runtime-smoke.py

      - name: Built GA4 measurement workflow (TEST fixtures, local Google stand-in, mock only)
        env:
          HOSTED_SMOKE_ALLOWED: "1"
        run: python3 scripts/ga4-measurement-runtime-smoke.py
