services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openrecord
      POSTGRES_PASSWORD: openrecord
      POSTGRES_DB: openrecord
    ports:
      - "5432:5432"
    volumes:
      # The long-lived dev database (businesses, conversations, check runs).
      # An external named volume so recreating this project never resets it.
      - openrecord_openrecord-pg:/var/lib/postgresql/data
volumes:
  openrecord_openrecord-pg:
    external: true
